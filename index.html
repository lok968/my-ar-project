<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - 3D交互平台</title>
    
    <!-- 核心库引入 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .a-enter-vr { display: none; }

      /* UI 界面 */
      #ui-panel {
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
        z-index: 1000; display: none; text-align: center;
      }

      .btn {
        padding: 15px 30px; background: #ffffff; border: none;
        border-radius: 50px; font-weight: bold; cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4); font-size: 16px;
      }
    </style>
  </head>
  
  <body>
    <!-- 语音按钮 -->
    <div id="ui-panel">
      <button id="voice-btn" class="btn">👋 点击跟我说话</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.1; warmupTolerance: 7; missTolerance: 50" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      cursor="rayOrigin: mouse" 
      raycaster="objects: .clickable">

      <a-assets>
        <!-- 使用本地相对路径加载模型 -->
        <a-asset-item id="avatarModel" src="./my_model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 扫描目标：对应 targets.mind 中的第一个图 -->
      <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
        
        <a-gltf-model 
          id="character"
          class="clickable"
          src="#avatarModel" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="2 2 2"
          animation-mixer="clip: *; loop: repeat"
          animation="property: rotation; to: 0 360 0; dur: 12000; easing: linear; loop: true">
          <!-- 这里 scale="2 2 2" 让模型变大一倍，dur: 12000 让旋转更平滑 -->
        </a-gltf-model>

      </a-entity>

      <!-- 补光灯 -->
      <a-light type="ambient" intensity="1.0"></a-light>
      <a-light type="directional" position="0 2 2" intensity="0.5"></a-light>
    </a-scene>

    <script>
      const character = document.querySelector('#character');
      const uiPanel = document.querySelector('#ui-panel');
      const voiceBtn = document.querySelector('#voice-btn');
      const targetEntity = document.querySelector('#targetEntity');

      // 1. 扫描状态监控
      targetEntity.addEventListener("targetFound", () => {
        uiPanel.style.display = 'block';
        console.log("识别成功：显示模型和UI");
      });

      targetEntity.addEventListener("targetLost", () => {
        uiPanel.style.display = 'none';
      });

      // 2. 语音互动 (利用浏览器自带的 TTS 引擎)
      voiceBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const msg = new SpeechSynthesisUtterance("你好！我是你的AR助手，很高兴见到你。");
        msg.lang = 'zh-CN';
        msg.rate = 1.0; // 语速
        window.speechSynthesis.speak(msg);
        
        // 播放语音时模型变大一下
        character.setAttribute('animation__bounce', 'property: scale; to: 2.2 2.2 2.2; dur: 200; dir: alternate; loop: 2');
      });

      // 3. 触摸互动
      character.addEventListener('click', () => {
        // 改变动画 (如果模型有动画的话)
        character.setAttribute('animation-mixer', {clip: '*', repetitions: 1});
        alert("你触碰了 3D 人物！");
      });
    </script>
  </body>
</html>
